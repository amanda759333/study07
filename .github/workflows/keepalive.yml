# 작성일시: 2026-11-01 11:47 (KST)
#
# DB(Supabase) 일시정지 방지(공고 3장 「DB(Supabase)가 일시정지되지 않게」 어려운 해결, 4.4, 교수님 작업 #19)
# 외부 예약 서비스(GitHub Actions)로 매일 DB에 작은 질의를 보낸다. 내 컴퓨터가 꺼져 있어도 돌아간다.
# DB 주소는 저장소 Settings → Secrets and variables → Actions의 DATABASE_URL에서 읽는다(코드에 적지 않음, 공고 4.1).
name: DB 일시정지 방지

on:
  schedule:
    - cron: "17 0,12 * * *"  # 하루 두 번: 한국 시각 09:17, 21:17 (UTC 00:17, 12:17)
  workflow_dispatch:          # 저장소의 Actions 화면에서 손으로도 돌릴 수 있음

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DB에 작은 질의 보내기
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pip install --quiet "psycopg[binary]==3.3.6"
          python - <<'PY'
          import os
          import psycopg

          url = os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("DATABASE_URL 없음: 저장소 Secrets에 넣어야 함")
          try:
              with psycopg.connect(url, connect_timeout=30) as conn:
                  rows = conn.execute("select count(*) from tf_settings").fetchone()[0]
          except psycopg.OperationalError:
              # 오류 원문에는 DB 주소 일부가 섞일 수 있으므로 출력하지 않는다(공고 6.3-8)
              raise SystemExit("DB에 연결하지 못함: Supabase가 일시정지되었는지 대시보드에서 확인")
          print(f"DB 응답 있음(tf_settings {rows}행)")
          PY
